name: "SoSync Companion"
slug: "sosync_companion"
description: "Local setup companion for SoSync Home Server"
version: "1.0.42"

arch:
  - aarch64
  - amd64

image: "ghcr.io/sosync-app/sosync-connection"

init: false
startup: services
boot: auto

host_network: true
ingress: true
ingress_port: 8765
ingress_entry: /
ingress_stream: true

options:
  backend_signing_public_key: ""
  e2ee_pairing_authorization: {}
schema:
  backend_signing_public_key: "str?"
  e2ee_pairing_authorization:
    token: "str?"
    expires_at: "str?"
